name: Deploy Pages

on:
  workflow_call:

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: publish
        uses: actions/deploy-pages@v4
      - name: Verify deployed demo
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/" -o /tmp/claims-index.html
          grep -F '<title>Healthcare Claims Denial Copilot</title>' /tmp/claims-index.html
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/demo.json" |
            python -c 'import json,sys; d=json.load(sys.stdin); assert any(x["id"]=="CLM-GUIDE-1" for x in d["lines"])'
