name: Deploy Pages

on:
  workflow_call:

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: publish
        uses: actions/deploy-pages@v4
      - name: Verify deployed demo
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/" -o /tmp/claims-index.html
          grep -F '<title>Healthcare Claims Denial Copilot</title>' /tmp/claims-index.html
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/demo.json" |
            python -c 'import json,sys; d=json.load(sys.stdin); assert any(x["id"]=="CLM-GUIDE-1" for x in d["lines"])'
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/model-governance.json" |
            python -c 'import json,sys; d=json.load(sys.stdin); assert "logistic" in d["test"] and len(d["dataset_sha256"]) == 64'
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/three-year-analysis.json" |
            python -c 'import json,sys; d=json.load(sys.stdin); assert (d["claims"], d["claim_lines"], len(d["monthly_summary"])) == (500000,2000000,36)'
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/claims-2023-2025-extra-large.zip" -o /tmp/claims-download.zip
          python -c 'import json,zipfile; z=zipfile.ZipFile("/tmp/claims-download.zip"); assert {"claims.csv","claim_lines.parquet","annual_summary.csv"} <= set(z.namelist()); assert json.loads(z.read("manifest.json"))["counts"]["claim_lines"]==2000000'
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/claims-archive/index.json" |
            python -c 'import json,sys; d=json.load(sys.stdin); assert d["lines"] == 2000000 and len(d["feeds"]) == 3 and len(d["groups"]) == 9'
          curl --fail --silent --show-error --retry 8 --retry-all-errors "${PAGE_URL%/}/claims-archive/feed=hospital/service_year=2025/chunk=0/rows_0.csv.gz" -o /tmp/archive-page.csv.gz
          python -c 'import gzip; rows=list(gzip.open("/tmp/archive-page.csv.gz","rt")); assert len(rows)==1000 and all(len(line.rstrip("\n").split("\t"))==8 for line in rows)'
