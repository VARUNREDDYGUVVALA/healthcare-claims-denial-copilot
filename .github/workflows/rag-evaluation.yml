name: Temporal policy retrieval evaluation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m evaluation.rag.evaluate_policies
      - run: python -m pytest -q tests/integration/test_pipeline.py -k "policy_boundary or missing_extract"
