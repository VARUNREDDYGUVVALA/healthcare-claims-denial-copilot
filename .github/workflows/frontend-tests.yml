name: Frontend tests and build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Build the downloadable dataset and verify the dashboard summary
        working-directory: .
        run: |
          python -m pip install -r requirements.txt
          python -m scripts.export_three_year_analysis --preset extra-large --detail-format parquet \
            --output apps/frontend/public/claims-2023-2025-extra-large.zip \
            --summary-output apps/frontend/public/three-year-analysis.json
          git diff --exit-code -- apps/frontend/public/three-year-analysis.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: apps/frontend/dist
