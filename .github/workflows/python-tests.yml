name: Python tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-24.04
    env:
      COPILOT_ANALYST_TOKEN: ci-only-analyst-token-00000000
      COPILOT_SUPERVISOR_TOKEN: ci-only-supervisor-token-00000000
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the local container
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Exercise local API and verify the built app
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ -o /tmp/claims-compose.html
          grep -F '<title>Healthcare Claims Denial Copilot</title>' /tmp/claims-compose.html
          curl --fail --silent --show-error http://127.0.0.1:8000/api/investigations \
            -H "Authorization: Bearer $COPILOT_ANALYST_TOKEN" -H 'Content-Type: application/json' \
            --data '{"line_id":"CLM-LEDGER-1"}' |
            python3 -c 'import json,sys; run=json.load(sys.stdin); assert run["status"]=="awaiting_review"; assert run["policy"]["id"]=="NS-IMG-2026-v1"'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the local container
        if: always()
        run: docker compose down
