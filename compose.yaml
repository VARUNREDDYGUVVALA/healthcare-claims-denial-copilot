services:
  copilot:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      COPILOT_ANALYST_TOKEN: "${COPILOT_ANALYST_TOKEN:?Set COPILOT_ANALYST_TOKEN}"
      COPILOT_SUPERVISOR_TOKEN: "${COPILOT_SUPERVISOR_TOKEN:?Set COPILOT_SUPERVISOR_TOKEN}"
    volumes:
      - claims-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      retries: 12
      start_period: 60s
      timeout: 3s

volumes:
  claims-artifacts:
